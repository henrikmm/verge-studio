name: Local verification

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then exit 0; fi
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          else
            brew install ffmpeg
          fi
      - name: Install app dependencies exactly
        run: npm ci --prefix app
      - name: Install server contract dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Exercise local frame extraction
        shell: bash
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          ffmpeg -nostdin -v error -f lavfi -i testsrc=duration=2:size=64x48:rate=12 -c:v mpeg4 -y "${work}/clip.mp4"
          node scripts/extract-frames.mjs "${work}/clip.mp4" "${work}/frames" --fps 4 --max-frames 4
          test "$(find "${work}/frames" -name '*.jpg' | wc -l | tr -d ' ')" -eq 4
      - name: Verify local-only paths
        run: VERGE_PY=python ./scripts/verify.sh
